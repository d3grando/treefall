[package]
name = "horizon-treefall"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "TreeFall: a native Horizon mod that fells whole trees"
publish = false

[lib]
# This exact source is also injected as `crate::game::treefall` by horizon-mixins.
path = "mixins/treefall/runtime.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
